<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平行眼 · 深度图还原</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f2;color:#183c39;font:16px/1.6 Inter,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:7vh 5vw}h1{font-size:clamp(32px,5vw,56px);line-height:1.15;margin:0 0 14px;letter-spacing:-.05em}p{margin:0 0 24px}section{background:white;border:1px solid #cbd9d6;border-radius:18px;padding:20px}header,.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}button,.pick{font:inherit;border:1px solid #b1c8c3;border-radius:8px;padding:8px 16px;background:white;color:inherit;cursor:pointer}.pick{background:#14594e;color:white;position:relative}.pick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}.pick:focus-within,button:focus-visible{outline:3px solid #269f91}input[type=number]{width:6em;padding:8px;border:1px solid #aec2bd;border-radius:6px;font:inherit}button:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}figure{margin:0}figcaption{font-weight:650;margin-bottom:6px}.panel{background:#edf2f1;min-height:230px;display:grid;place-items:center;border-radius:10px;overflow:hidden;color:#536f69}.panel>*{grid-area:1/1}.panel canvas{display:block;width:100%;height:auto}.panel canvas[hidden]{display:none}small{color:#486660}details{margin:12px 0}summary{cursor:pointer}#status{margin:0;flex:1}footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:650px){main{padding:32px 14px}.grid{grid-template-columns:1fr}.panel{min-height:145px}section{padding:14px}}
</style><main><h1>平行眼深度图还原</h1><p>选一张横向重复纹理的立体图，直接查看藏在里面的形状。</p><section><header><label class="pick">选择图片<input id="file" type="file" accept="image/*" aria-label="选择立体图"></label><small>图片仅在当前设备处理</small></header>
<div class="grid"><figure><figcaption>原图</figcaption><div class="panel"><span>在这里预览原图</span><canvas hidden id="src"></canvas></div></figure><figure><figcaption>相对深度 · 越亮越近</figcaption><div class="panel"><span>解码结果将在这里显示</span><canvas hidden id="dst"></canvas></div></figure></div>
<details><summary>调整重复间距</summary><small>自动识别不准时，输入原图同一行中相邻两处相同背景花纹的像素间距。留空使用自动识别。</small><div class="controls"><label>间距（px） <input id="period" type="number" min="1" step="1" placeholder="自动"></label><button id="again" disabled>重新解码</button></div></details>
<footer><p id="status" role="status">等待选择图片</p><button disabled id="save">下载 PNG</button></footer></section></main>
<script id="algorithm" type="text/plain">
function decode(data,w,h,override){
 const gray=new Uint8Array(w*h);
 for(let i=0;i<gray.length;i++)gray[i]=(data[4*i]*3+data[4*i+1]*6+data[4*i+2])/10;
 const limit=Math.floor(w*.48),start=Math.max(7,Math.round(w*.022));
 let p=override;
 if(!p){
   const scores=[];
   for(let d=start;d<=limit;d++){
     let sum=0,n=0;
     for(let y=3;y<h-3;y+=4)for(let x=d+3;x<w-3;x+=4){
       sum+=Math.min(30,Math.abs(gray[y*w+x]-gray[y*w+x-d]));n++;
     }
     scores[d]=sum/n;
   }
   let best=Infinity;
   for(let d=start+2;d<limit-1;d++)if(scores[d]<=scores[d-1]&&scores[d]<=scores[d+1]&&scores[d]<best*.96){best=scores[d];p=d}
   const baseline=scores.slice(start).sort((a,b)=>a-b)[Math.floor((limit-start)/2)];
   if(!p||best>baseline*.94||baseline<2)throw Error('未找到可靠的重复纹理，请手动指定间距。');
 }
 if(p<6||p>limit)throw Error('间距超出范围，请填写小于原图宽度一半的背景重复间距。');
 const margin=Math.ceil(p*.53)+4,W=w-2*margin,N=W*h;
 const best=new Float32Array(N).fill(Infinity),disp=new Uint16Array(N);
 const stride=W+1,integral=new Float32Array(stride*(h+1));
 for(let d=Math.max(4,Math.floor(.64*p));d<=Math.ceil(1.04*p);d++){
   for(let y=0;y<h;y++){
     let sum=0,j=(y+1)*stride+1,k=y*w+margin-Math.floor(d/2);
     for(let x=0;x<W;x++,k++,j++){
       sum+=Math.min(60,Math.abs(gray[k]-gray[k+d]));
       integral[j]=integral[j-stride]+sum;
     }
   }
   for(let y=0;y<h;y++){
     const a=Math.max(0,y-3)*stride,b=Math.min(h,y+4)*stride;
     for(let x=0,i=y*W;x<W;x++,i++){
       const l=Math.max(0,x-4),r=Math.min(W,x+5);
       const cost=integral[b+r]-integral[a+r]-integral[b+l]+integral[a+l];
       if(cost<best[i]){best[i]=cost;disp[i]=d}
     }
   }
 }
 // Fill weak matches from the closest reliable pixel before smoothing.
 const distance=new Uint16Array(N);
 for(let i=0;i<N;i++){
   const x=i%W,y=Math.floor(i/W);
   const area=(Math.min(W,x+5)-Math.max(0,x-4))*(Math.min(h,y+4)-Math.max(0,y-3));
   distance[i]=best[i]/area<13?0:60000;
 }
 function borrow(i,j){if(distance[j]+1<distance[i]){distance[i]=distance[j]+1;disp[i]=disp[j]}}
 for(let i=0;i<N;i++){if(i%W)borrow(i,i-1);if(i>=W)borrow(i,i-W)}
 for(let i=N-1;i>=0;i--){if(i%W<W-1)borrow(i,i+1);if(i+W<N)borrow(i,i+W)}
 const hist=new Uint32Array(w),temp=new Uint16Array(9);
 for(let y=0;y<h;y++)for(let x=0;x<W;x++){
   let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)temp[n++]=disp[Math.min(h-1,Math.max(0,y+dy))*W+Math.min(W-1,Math.max(0,x+dx))];
   temp.sort();best[y*W+x]=temp[4];hist[temp[4]]++;
 }
 let near=0,count=0;while(near<p&&count+hist[near]<N*.03)count+=hist[near++];
 const out=new Uint8ClampedArray(N*4);
 for(let i=0;i<N;i++){out[4*i]=out[4*i+1]=out[4*i+2]=12+233*Math.max(0,(p-best[i])/Math.max(2,p-near));out[4*i+3]=255}
 return {out,W,h,p}
}
</script>
<script>
const el=id=>document.getElementById(id),src=el('src'),dst=el('dst'),statusText=el('status');
const workerUrl=URL.createObjectURL(new Blob([el('algorithm').textContent,`
onmessage=e=>{try{const {data,w,h,p}=e.data;const r=decode(data,w,h,p);postMessage(r,[r.out.buffer])}catch(error){postMessage({error:error.message})}}`],{type:'application/javascript'}));
let worker,serial=0,scale=1,base='depth';
function visible(c,v){c.hidden=!v;c.previousElementSibling.hidden=v}
function reset(){worker?.terminate();visible(dst,false);el('save').disabled=true}
function run(){reset();const v=el('period');if(!v.reportValidity())return;
 statusText.textContent='正在匹配重复纹理…';
 const w=src.width,h=src.height;const {data}=src.getContext('2d').getImageData(0,0,w,h);
 worker=new Worker(workerUrl);
 worker.onmessage=({data:r})=>{worker.terminate();if(r.error){statusText.textContent=r.error;return}
 dst.width=r.W;dst.height=r.h;dst.getContext('2d').putImageData(new ImageData(r.out,r.W,r.h),0,0);visible(dst,true);el('save').disabled=false;
 statusText.textContent='背景间距约 '+Math.round(r.p/scale)+' px · 两侧无法配对的区域已裁去'};
 worker.onerror=()=>{statusText.textContent='解码失败，请尝试较小的图片或重新选择。';worker.terminate()};
 worker.postMessage({data,w,h,p:v.value?Math.max(1,Math.round(Number(v.value)*scale)):0},[data.buffer])}
el('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const id=++serial;reset();visible(src,false);el('again').disabled=true;el('period').value='';statusText.textContent='正在读取图片…';const url=URL.createObjectURL(f);
 try{const im=new Image();im.src=url;await im.decode();if(id!==serial)return;
 scale=Math.min(1,800/im.naturalWidth,850/im.naturalHeight);src.width=Math.round(im.naturalWidth*scale);src.height=Math.round(im.naturalHeight*scale);if(src.width<60||src.height<12)throw Error('图片太小或过窄，无法解码。');
 src.getContext('2d').drawImage(im,0,0,src.width,src.height);base=f.name.replace(/\.[^.]+$/,'');visible(src,true);el('again').disabled=false;run()}catch(err){if(id===serial)statusText.textContent=err.message||'无法读取此图片'}finally{URL.revokeObjectURL(url)}};
el('again').onclick=run;el('save').onclick=()=>{const a=document.createElement('a');a.download=base+'-depth.png';a.href=dst.toDataURL();a.click()};
</script></html>
